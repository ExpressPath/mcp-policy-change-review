name: Synthetic release smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  action-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false

      - name: Install official OPA release
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/open-policy-agent/opa/releases/download/v1.22.0/opa_linux_amd64'
          expected='ab4d4f59b3f2e64bfc8b4bde7a1eeb2eb08480dffea685b4bd8297c553769a3a'
          curl --fail --location --silent --show-error --retry 3 "$url" --output "$RUNNER_TEMP/opa"
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/opa" | sha256sum --check --status
          chmod 0755 "$RUNNER_TEMP/opa"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/opa" version

      - name: Install official Cedar CLI release
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/cedar-policy/cedar/releases/download/cedar-policy-cli-v4.14.1/cedar-policy-cli-x86_64-unknown-linux-gnu.tar.xz'
          expected='5833e9f4734eac0d95b3dab7ae119a9212caf0a82e02720b989e2fce6f3bfdad'
          archive="$RUNNER_TEMP/cedar-policy-cli.tar.xz"
          curl --fail --location --silent --show-error --retry 3 "$url" --output "$archive"
          printf '%s  %s\n' "$expected" "$archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/cedar"
          tar -xJf "$archive" --strip-components=1 -C "$RUNNER_TEMP/cedar"
          chmod 0755 "$RUNNER_TEMP/cedar/cedar"
          echo "$RUNNER_TEMP/cedar" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cedar/cedar" --version

      - name: Review synthetic OPA planes with this Action
        id: opa-review
        uses: ./
        with:
          manifest: examples/multi-plane/mcp-multi-review.json
          require-common-cases: 'true'
          require-policy-coverage: 'true'
          fail-on-unexpected-new-allow: 'true'
          report-file: synthetic-opa-report.json

      - name: Check the machine-readable OPA report
        shell: bash
        env:
          REPORT_PATH: ${{ steps.opa-review.outputs.report-path }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test "$REPORT_PATH" = 'synthetic-opa-report.json'
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync(process.env.REPORT_PATH, 'utf8'));
          if (report.engine !== 'mcp-multi-review' || report.summary.passed !== true || report.evidence.signed !== false) {
            throw new Error('The generated JSON report did not match the expected synthetic OPA review.');
          }
          NODE

      - name: Reject unsafe or existing report paths
        shell: bash
        run: |
          set -euo pipefail
          existing_hash="$(sha256sum synthetic-opa-report.json | cut -d ' ' -f1)"
          set +e
          node bin/agent-policy-check.js mcp-multi-review \
            --manifest examples/multi-plane/mcp-multi-review.json \
            --report-file synthetic-opa-report.json --format github \
            >"$RUNNER_TEMP/existing-report.log" 2>&1
          existing_status=$?
          node bin/agent-policy-check.js mcp-multi-review \
            --manifest examples/multi-plane/mcp-multi-review.json \
            --report-file ../outside-workspace-report.json --format github \
            >"$RUNNER_TEMP/outside-report.log" 2>&1
          outside_status=$?
          set -e
          test "$existing_status" -eq 2
          test "$outside_status" -eq 2
          test "$(sha256sum synthetic-opa-report.json | cut -d ' ' -f1)" = "$existing_hash"
          grep -F 'already exists' "$RUNNER_TEMP/existing-report.log"
          grep -F 'inside the GitHub workspace' "$RUNNER_TEMP/outside-report.log"

      - name: Review synthetic Cedar planes with this Action
        uses: ./
        with:
          manifest: examples/multi-plane/mcp-multi-review-cedar.json
          require-common-cases: 'true'
          require-policy-coverage: 'true'
          fail-on-unexpected-new-allow: 'true'

      - name: Confirm intentional OPA regression is rejected
        id: expected-drift
        uses: ./
        continue-on-error: true
        with:
          manifest: examples/multi-plane/mcp-multi-review-drift.json
          require-common-cases: 'true'
          require-policy-coverage: 'true'
          fail-on-unexpected-new-allow: 'true'
          fail-on-candidate-divergence: 'true'
          report-file: synthetic-opa-drift-report.json

      - name: Assert regression result
        shell: bash
        env:
          DRIFT_OUTCOME: ${{ steps.expected-drift.outcome }}
          DRIFT_EXIT_CODE: ${{ steps.expected-drift.outputs.exit-code }}
          DRIFT_REPORT_PATH: ${{ steps.expected-drift.outputs.report-path }}
        run: |
          set -euo pipefail
          test "$DRIFT_OUTCOME" = failure
          test "$DRIFT_EXIT_CODE" = 1
          test "$DRIFT_REPORT_PATH" = 'synthetic-opa-drift-report.json'
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync(process.env.DRIFT_REPORT_PATH, 'utf8'));
          if (report.summary.passed !== false || report.summary.candidate_divergences < 1) {
            throw new Error('The drift report did not record the expected divergence.');
          }
          NODE
